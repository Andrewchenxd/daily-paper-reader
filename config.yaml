subscriptions:
  schema_migration:
    stage: A
    diff_threshold_pct: 15
  keyword_recall_mode: or
  intent_profiles:
    - tag: skill-evo
      description: 检索对话式技能自动新增、修改与优化相关文献，支撑Agent自进化，涵盖SP/skill设计规范、跨基座模型鲁棒性、免训练提示自动优化与质量评估。
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: conversational skill development
          keyword_cn: 对话式技能开发
          query: conversational skill development in AI agents
        - keyword: skill evolution
          keyword_cn: 技能进化
          query: automatic evolution and improvement of agent skills
        - keyword: cross-model prompt transferability
          keyword_cn: 跨模型提示可迁移性
          query: portability and robustness of prompts across different foundation models and model versions
        - keyword: model-agnostic prompt design
          keyword_cn: 模型无关提示设计
          query: prompt design strategies that remain effective when the underlying base model is changed
        - keyword: skill quality assessment
          keyword_cn: 技能质量评估
          query: evaluation criteria and metrics for measuring the quality of generated skills and prompts
        - keyword: prompt auto optimization
          keyword_cn: 提示自动优化
          query: automatic optimization of prompts or instructions without fine tuning a model
      intent_queries:
        - query: What are effective approaches for self optimization of agent skills without human manual coding?
          query_cn: 在没有人工编码的情况下，智能体技能自我优化的有效方法有哪些？
          enabled: true
          source: manual
          note: ''
        - query: How does an agent evolve its skills through self improvement and feedback?
          query_cn: 智能体如何通过自我改进和反馈来进化技能？
          enabled: true
          source: manual
          note: ''
        - query: >-
            how to write agent skill definitions and system prompts with clear structure and standards, so they remain
            effective when changing the underlying base model
          query_cn: 如何以清晰结构与标准编写系统提示和智能体技能定义，使其在更换底层模型时仍然有效
          enabled: true
          source: manual
          note: ''
        - query: >-
            training free automatic prompt optimization methods that improve instructions without any model training or
            fine tuning
          query_cn: 无需任何模型训练或微调的免训练自动提示优化方法
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-09-04T02:28:40.474Z'
